<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e1e2e" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0a0a0f"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="600" y="200" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#e8e8ed">commently<tspan fill="#00d4aa">_</tspan></text>
  <text x="600" y="290" text-anchor="middle" font-family="-apple-system, SF Pro Display, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#e8e8ed" letter-spacing="-2">Comments for</text>
  <text x="600" y="360" text-anchor="middle" font-family="-apple-system, SF Pro Display, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#00d4aa" letter-spacing="-2">any application.</text>
  <text x="600" y="420" text-anchor="middle" font-family="-apple-system, SF Pro Display, Helvetica, Arial, sans-serif" font-size="22" fill="#8a8a9a">Self-hosted, multi-tenant comments API with threading, reactions, and webhooks.</text>
  <g transform="translate(330, 460)">
    <rect x="0" y="0" width="120" height="36" rx="18" fill="none" stroke="#2a2a3e" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#8a8a9a">Multi-tenant</text>
    <rect x="136" y="0" width="100" height="36" rx="18" fill="none" stroke="#2a2a3e" stroke-width="1"/>
    <text x="186" y="23" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#8a8a9a">Threaded</text>
    <rect x="252" y="0" width="106" height="36" rx="18" fill="none" stroke="#2a2a3e" stroke-width="1"/>
    <text x="305" y="23" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#8a8a9a">Webhooks</text>
    <rect x="374" y="0" width="130" height="36" rx="18" fill="none" stroke="#2a2a3e" stroke-width="1"/>
    <text x="439" y="23" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="13" fill="#8a8a9a">Open Source</text>
  </g>
</svg>
